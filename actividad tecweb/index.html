<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión de Usuarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Gestión de Usuarios</h1>
    </header>
    
    <main class="contenedor">
        <section class="panel-formulario">
            <h2>Datos del Usuario</h2>
            <form id="formulario-usuario">
                <div class="grupo-input">
                    <label for="id">ID:</label>
                    <input type="number" id="id" required>
                </div>
                <div class="grupo-input">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="grupo-input">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" required>
                </div>
                <div class="grupo-input">
                    <label for="ciudad">Ciudad:</label>
                    <input type="text" id="ciudad" required>
                </div>
                <button type="submit" id="btn-submit">Agregar Usuario</button>
            </form>
            <p id="mensaje-estado"></p>
        </section>

        <section class="panel-tabla">
            <h2>Lista de Usuarios</h2>
            <input type="text" id="buscador" placeholder="Buscar usuario por nombre...">
            
            <div class="contenedor-tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        <!-- El contenido se inyectará dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
